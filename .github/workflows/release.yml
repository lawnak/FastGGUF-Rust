name: Release

# Builds fastgguf.exe for Windows x64 and attaches it to the GitHub Release.
# - Push a tag like v0.2.0: builds that tag and creates the release if it does not exist.
# - Run it by hand (Actions tab -> Release -> Run workflow) to rebuild an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and upload (for example v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      # Link the C runtime statically: the .exe then runs without the VC++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0   # full history and tags, for the "What's new" list

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Build
        run: cargo build --release --locked

      - name: Self-test
        run: target\release\fastgguf.exe selftest

      - name: Package
        shell: pwsh
        run: |
          $name = "fastgguf-rs-$env:TAG-windows-x64"
          New-Item -ItemType Directory -Force dist\$name | Out-Null
          Copy-Item target\release\fastgguf.exe, README.md dist\$name\
          Compress-Archive -Path dist\$name\* -DestinationPath dist\$name.zip -Force
          "ZIP=dist/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: fastgguf-windows-x64
          path: ${{ env.ZIP }}

      # Fill .github/release-notes.md: {{TAG}}, {{CHANGES}} (commits since the previous
      # tag) and {{COMPARE}} (link to the diff). The template is read from the commit
      # this workflow runs from, so a manual run can fill notes for an older tag too.
      - name: Write release notes
        shell: bash
        run: |
          template=$(git show "$GITHUB_SHA:.github/release-notes.md" 2>/dev/null) || exit 0
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null) || prev=
          if [ -n "$prev" ]; then
            changes=$(git log --no-merges --reverse --pretty='- %s' "$prev..$TAG")
            compare="https://github.com/$GITHUB_REPOSITORY/compare/$prev...$TAG"
          else
            changes=$(git log --no-merges --reverse --pretty='- %s' "$TAG")
            compare="https://github.com/$GITHUB_REPOSITORY/commits/$TAG"
          fi
          notes=${template//'{{TAG}}'/"$TAG"}
          notes=${notes//'{{CHANGES}}'/"$changes"}
          notes=${notes//'{{COMPARE}}'/"$compare"}
          printf '%s\n' "$notes" > dist/notes.md
          cat dist/notes.md

      # Creates the release if needed. Notes are only written to a release whose
      # description is empty, so notes edited by hand are never replaced.
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            if [ -f dist/notes.md ]; then
              gh release create "$TAG" --title "$TAG" --notes-file dist/notes.md
            else
              gh release create "$TAG" --title "$TAG" --generate-notes
            fi
          elif [ -f dist/notes.md ] && [ -z "$(gh release view "$TAG" --json body -q .body)" ]; then
            gh release edit "$TAG" --notes-file dist/notes.md
          fi
          gh release upload "$TAG" "$ZIP" --clobber
